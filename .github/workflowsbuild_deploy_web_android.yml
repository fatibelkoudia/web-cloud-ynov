name: build and deploy Web & Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]
    steps:
      # Step 1: Download the code onto the virtual machine
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js (the engine that runs npm/npx)
      - name: 🏗 Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # Step 3: Install project dependencies
      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Build & Export Web App
        # This triggers 'npx expo export -p web' as defined in your package.json
        run: npm run predeploy

      - name: 📤 Upload artifact
        # This saves the 'dist' folder so the next job can find it
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          if-no-files-found: error

    # JOB 2: DEPLOY
    deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      steps:
        - name: 🚀 Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
